<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111318"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="My Fitness"><title>My Fitness</title><style>*{box-sizing:border-box}body{margin:0;background:#101217;color:#fff;font:15px -apple-system,BlinkMacSystemFont,Arial,sans-serif}main{max-width:650px;margin:auto;padding:calc(22px + env(safe-area-inset-top)) 14px 40px}.brand{font-size:12px;font-weight:800;letter-spacing:2px;color:#ff6673}h1{margin:7px 0 4px;font-size:29px}.muted{color:#aab0bc;font-size:13px}.tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:24px 0 20px}.tabs button{padding:14px 0;background:#2b2e37;color:white;border:0;border-radius:8px;font-weight:700;font-size:12px}.tabs .active{background:#d72536}.progress{display:flex;justify-content:space-between;font-size:13px}.track{background:#343944;height:7px;border-radius:9px;margin:9px 0 24px;overflow:hidden}.fill{background:#f04455;height:100%}.group{color:#ff6876;font-size:12px;letter-spacing:1px;font-weight:800;margin:23px 0 10px}.item{display:flex;gap:12px;align-items:center;background:#23262e;border-radius:14px;padding:11px;margin:9px 0}.item.done{background:#1b352c}.art{flex:0 0 78px;width:78px;height:76px;border-radius:10px;background:#343943;border:0;display:grid;place-items:center;padding:4px;color:#ffc2c7}.art svg{width:100%;height:100%}.content{min-width:0;flex:1}.name{font-weight:750;font-size:14px}.dose{font-size:12px;color:#c4cad5;margin-top:5px}.rest{font-size:11px;color:#ffadb6;margin-top:5px}.tips{color:#d4d8e0;font-size:12px;line-height:1.45;margin-top:7px}.toggle{border:0;background:transparent;color:#ff9aa5;padding:8px 0 0;font-size:12px}.check{width:25px;height:25px;accent-color:#db2838}.panel{background:#242730;border-radius:14px;padding:16px;margin-top:24px}.panel button,.reset{background:#383d47;border:1px solid #5b606b;border-radius:8px;color:white;padding:10px;margin:5px 4px 0 0}.restline{display:flex;justify-content:space-between;border-top:1px solid #3e424b;padding:9px 0;font-size:12px;gap:8px}.restline span:last-child{color:#ffadb6;white-space:nowrap}.empty{text-align:center;padding:50px 15px;color:#c5cad2}.reset{margin-top:20px}.overlay{position:fixed;inset:0;background:#0c0e12f5;display:none;align-items:center;justify-content:center;flex-direction:column;padding:22px;z-index:10}.overlay svg{width:min(90vw,400px);height:330px}.overlay button{background:#d72536;color:white;border:0;border-radius:8px;padding:13px 26px}</style></head><body><main><div class="brand">MY FITNESS 💪🏼</div><h1 id="heading">Sunday Workout</h1><div class="muted" id="sub">Upper Body + Zone 2</div><nav class="tabs" id="tabs"></nav><section id="view"></section></main><div class="overlay" id="overlay" onclick="this.style.display='none'"><div id="large"></div><button>Close</button></div><script>const routine=[["warm","Warm-up","Treadmill Walk","10 min","Easy walking, then light warm-up sets",0],["bench","Chest & Back","Flat Barbell Bench Press","3 × 8–10","Controlled reps; shoulder blades stable",150],["lat","Chest & Back","Lat Pulldown","3 × 10–12","Lean back 10–20°, chest up, pull toward upper chest, no swinging",105],["incline","Chest & Back","Plate-Loaded Incline Chest Press","3 × 10","Use your incline chest press machine",105],["row","Chest & Back","Seated Cable Row","3 × 10–12","Keep torso steady, pull elbows back",105],["shoulder","Shoulders","Nautilus Impact Shoulder Press","3 × 8–10","Try inner neutral-grip handles if comfortable",105],["rear","Shoulders","Nautilus Reverse Deltoid Fly","2 × 12–15","Reverse rear-delt fly only, not chest fly",75],["db","Biceps","Dumbbell Biceps Curls","3 × 10 · 35 / 35 / 40 lb each","Keep elbows still",75],["hammer","Biceps","Hammer Curls","3 × 10 · 25 lb each","Neutral grip, slow lowering",75],["ez","Biceps","Standing EZ-Bar Curls","2 × 10 · 70 lb total","Avoid rocking torso",75],["tri","Triceps","Cable Triceps Pushdowns","3 × 10–12","High pulley, metal V-shaped neutral-grip handle; elbows close; pad optional only if comfortable and cable clears",75],["tread","Cardio · Zone 2","Incline Treadmill","30 min · Zone 2","First cardio finisher; adjust speed/incline to stay Zone 2",0],["stair","Cardio · Zone 2","StairMaster","30 min · Zone 2","Second cardio finisher; adjust pace to stay Zone 2",0]],days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];let day='Sun',remaining=0,timer;const el=id=>document.getElementById(id);function date(){let d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}function key(id){return 'myfitness:'+date()+':'+day+':'+id}function art(id){let shapes={warm:'M15 65H85M25 57H75L65 46H36M52 22L45 40 62 50',bench:'M12 60H88M25 60V73M75 60V73M25 34H75M30 43H70M42 43L36 60M58 43L64 60',lat:'M15 14H85M50 14V33M25 33H75M50 33V65M30 69H70M30 46L50 33 70 46',incline:'M20 70L65 27M20 70H82M36 55L50 67M60 30L80 17M68 25L80 45',row:'M13 69H87M25 45H59M30 45V67M50 26L60 45M60 45L82 35M82 18V67',shoulder:'M25 69V36M25 69H75M50 60V30M24 29H76M32 23V14M68 23V14M32 23L50 30 68 23',rear:'M50 30V66M42 30L18 16M58 30L82 16M42 30L20 46M58 30L80 46M27 69H73',db:'M50 20V52M50 30L30 44M50 30L70 44M30 44L22 30M70 44L78 30M50 52L35 73M50 52L65 73',hammer:'M50 20V52M50 30L30 44M50 30L70 44M22 29V43M78 29V43M50 52L35 73M50 52L65 73',ez:'M50 20V54M50 30L32 44M50 30L68 44M14 44L30 48 40 42 60 48 70 42 86 48M50 54L35 73M50 54L65 73',tri:'M50 10V30M50 30L35 42 50 50 65 42 50 30M50 50V68M25 69H75',tread:'M12 70H86M22 60H82M29 60L46 40 64 48M46 40L51 25M51 25L66 35',stair:'M12 72H32V57H52V42H72V27H88M35 23L52 40 44 57M52 40L68 51'};return '<svg viewBox="0 0 100 82" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schematic exercise illustration"><rect width="100" height="82" rx="10" fill="#343943"/><circle cx="50" cy="15" r="6" fill="#f7b2b9"/><path d="'+(shapes[id]||'')+'" fill="none" stroke="#f7b2b9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>'}function enlarge(id){el('large').innerHTML=art(id);el('overlay').style.display='flex'}function mark(id,on){localStorage.setItem(key(id),on?'1':'0');render()}function notes(id){let n=el('n-'+id);n.hidden=!n.hidden}function reset(){if(confirm('Reset today’s completed exercises?')){routine.forEach(r=>localStorage.removeItem(key(r[0])));render()}}function clock(){if(el('clock'))el('clock').textContent=Math.floor(Math.max(remaining,0)/60)+':'+String(Math.max(remaining,0)%60).padStart(2,'0')}function start(s){clearInterval(timer);remaining=s;clock();timer=setInterval(()=>{remaining--;clock();if(remaining<=0)clearInterval(timer)},1000)}function render(){el('tabs').innerHTML=days.map(d=>'<button class="'+(d===day?'active':'')+'" onclick="day=\''+d+'\';render()">'+d+'</button>').join('');el('heading').textContent=day==='Sat'?'Saturday Rest Day':day==='Sun'?'Sunday Workout':day+' Workout';el('sub').textContent=day==='Sun'?'Upper Body + Zone 2':day==='Sat'?'Recovery day':'Workout not finalized';if(day!=='Sun'){el('view').innerHTML='<div class="empty"><h2>'+(day==='Sat'?'Rest & Recover':'Coming Soon')+'</h2><p>'+(day==='Sat'?'Enjoy your rest day.':'We will add your confirmed workout here.')+'</p></div>';return}let done=routine.filter(r=>localStorage.getItem(key(r[0]))==='1').length;let out='<div class="progress"><span>Workout progress</span><b>'+done+' / 13</b></div><div class="track"><div class="fill" style="width:'+(done/13*100)+'%"></div></div>',group='';for(let r of routine){let [id,g,name,dose,tip,rest]=r;if(g!==group){group=g;out+='<div class="group">'+g.toUpperCase()+'</div>'}let checked=localStorage.getItem(key(id))==='1';out+='<div class="item '+(checked?'done':'')+'"><button class="art" aria-label="Enlarge '+name+' illustration" onclick="enlarge(\''+id+'\')">'+art(id)+'</button><div class="content"><div class="name">'+name+'</div><div class="dose">'+dose+'</div>'+(rest?'<div class="rest">Rest '+(rest===150?'120–180':rest===105?'90–120':'60–90')+' sec</div>':'')+'<button class="toggle" onclick="notes(\''+id+'\')">Form tips ▾</button><div class="tips" id="n-'+id+'" hidden>'+tip+'</div></div><input class="check" aria-label="Complete '+name+'" type="checkbox" '+(checked?'checked':'')+' onchange="mark(\''+id+'\',this.checked)"></div>'}out+='<div class="panel"><b>⏱ Rest Timer</b><p class="muted">Tap a rest interval to start.</p><h2 id="clock">0:00</h2><button onclick="start(60)">1:00</button><button onclick="start(90)">1:30</button><button onclick="start(120)">2:00</button><p class="muted">Bench: 120–180 sec · Chest/back/shoulder presses & row: 90–120 sec · Rear delts/arms: 60–90 sec.</p></div><button class="reset" onclick="reset()">Reset today’s checks</button><p class="muted">Checks save locally on this device for each calendar day. Illustrations are schematic, not photographs of your exact machines.</p>';el('view').innerHTML=out;clock()}render();</script></body></html>
