<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111318"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="My Fitness"><title>My Fitness</title><style>*{box-sizing:border-box}body{margin:0;background:#101217;color:#fff;font:15px -apple-system,BlinkMacSystemFont,Arial,sans-serif}main{max-width:650px;margin:auto;padding:calc(22px + env(safe-area-inset-top)) 14px 40px}.brand{font-size:12px;font-weight:800;letter-spacing:2px;color:#ff6673}h1{margin:7px 0 4px;font-size:29px}.muted{color:#aab0bc;font-size:13px}.tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:24px 0 20px}.tabs button{padding:16px 0;background:#2b2e37;color:white;border:0;border-radius:8px;font-weight:700;font-size:12px}.tabs .active{background:#d72536}.progress{display:flex;justify-content:space-between;font-size:13px}.track{background:#343944;height:7px;border-radius:9px;margin:9px 0 24px;overflow:hidden}.fill{background:#f04455;height:100%}.group{color:#ff6876;font-size:12px;letter-spacing:1px;font-weight:800;margin:23px 0 10px}.item{display:flex;gap:14px;align-items:center;background:#23262e;border-radius:14px;padding:11px;margin:9px 0}.item.done{background:#1b352c;border:1px solid #2c644d}.item:not(.done){border:1px solid #343943}.item.done .name,.item.done .dose{text-decoration:line-through;text-decoration-thickness:2px;color:#8fba9d}.item{cursor:pointer;-webkit-tap-highlight-color:transparent;min-height:104px;transition:background .15s,border-color .15s}.item:focus-visible{outline:2px solid #ff6673;outline-offset:2px}.item:active{transform:scale(.995)}.art{flex:0 0 112px;width:112px;height:106px;border-radius:10px;background:#343943;border:0;display:grid;place-items:center;padding:4px;color:#ffc2c7}.art svg{width:100%;height:100%}.art{overflow:hidden;padding:0}.photo-wrap{position:relative;width:100%;height:100%;display:block;background:#222831}.photo-frame{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}.photo-second{animation:frames 3s ease-in-out infinite}@keyframes frames{0%,38%,100%{opacity:0}50%,86%{opacity:1}}.photo-label{position:absolute;bottom:0;left:0;right:0;background:#101217c9;color:white;font-size:9px;letter-spacing:.6px;padding:4px 2px}@media(prefers-reduced-motion:reduce){.photo-second{animation:none;opacity:0}}.content{min-width:0;flex:1}.name{font-weight:750;font-size:16px;line-height:1.3}.dose{font-size:14px;color:#c4cad5;margin-top:5px}.rest{font-size:11px;color:#ffadb6;margin-top:5px}.tips{color:#d4d8e0;font-size:13px;line-height:1.5;margin-top:7px}.toggle{border:0;background:transparent;color:#ff9aa5;padding:8px 0 3px;font-size:12px;cursor:pointer}.check{width:28px;height:28px;accent-color:#db2838;flex-shrink:0;cursor:pointer}.panel{background:#242730;border-radius:14px;padding:16px;margin-top:24px}.panel button,.reset{background:#383d47;border:1px solid #5b606b;border-radius:8px;color:white;padding:10px;margin:5px 4px 0 0}.restline{display:flex;justify-content:space-between;border-top:1px solid #3e424b;padding:9px 0;font-size:12px;gap:8px}.restline span:last-child{color:#ffadb6;white-space:nowrap}.empty{text-align:center;padding:50px 15px;color:#c5cad2}.reset{margin-top:20px}.overlay{position:fixed;inset:0;background:#0c0e12f5;display:none;align-items:center;justify-content:center;flex-direction:column;padding:22px;z-index:10}.overlay svg{width:min(90vw,400px);height:330px}.overlay button{background:#d72536;color:white;border:0;border-radius:8px;padding:13px 26px}</style></head><body><main><div class="brand">MY FITNESS 💪🏼</div><div class="muted">Weekly training plan · A/B rotation</div><h1 id="heading">Sunday Workout</h1><div class="muted" id="sub">Upper Body + Zone 2</div><nav class="tabs" id="tabs"></nav><section id="view"></section></main><div class="overlay" id="overlay" onclick="this.style.display='none'"><div id="large"></div><button>Close</button></div><script>const routine=[["warm","Warm-up","Treadmill Walk","10 min","Easy walking, then light warm-up sets",0],["bench","Chest & Back","Flat Barbell Bench Press","3 × 8–10","Controlled reps; shoulder blades stable",150],["lat","Chest & Back","Lat Pulldown","3 × 10–12","Lean back 10–20°, chest up, pull toward upper chest, no swinging",105],["incline","Chest & Back","Plate-Loaded Incline Chest Press","3 × 10","Use your incline chest press machine",105],["row","Chest & Back","Seated Cable Row","3 × 10–12","Keep torso steady, pull elbows back",105],["shoulder","Shoulders","Nautilus Impact Shoulder Press","3 × 8–10","Try inner neutral-grip handles if comfortable",105],["rear","Shoulders","Nautilus Reverse Deltoid Fly","2 × 12–15","Reverse rear-delt fly only, not chest fly",75],["db","Biceps","Dumbbell Biceps Curls","3 × 10 · 35 / 35 / 40 lb each","Keep elbows still",75],["hammer","Biceps","Hammer Curls","3 × 10 · 25 lb each","Neutral grip, slow lowering",75],["ez","Biceps","Standing EZ-Bar Curls","2 × 10 · 70 lb total","Avoid rocking torso",75],["tri","Triceps","Cable Triceps Pushdowns","3 × 10–12","High pulley, metal V-shaped neutral-grip handle; elbows close; pad optional only if comfortable and cable clears",75],["tread","Cardio · Zone 2","Incline Treadmill","30 min · Zone 2","First cardio finisher; adjust speed/incline to stay Zone 2",0],["stair","Cardio · Zone 2","StairMaster","30 min · Zone 2","Second cardio finisher; adjust pace to stay Zone 2",0 ]];const monday=[["m-stair","Warm-up","StairMaster","10 min","Easy warm-up pace",0],["m-abs","Core Machines","Ab Crunch Machine","3 × 10 · slow","Slow, controlled repetitions",75],["m-back","Core Machines","Lower Back Extension Machine","3 × 12 · slow","Controlled movement, avoid excessive arching",75],["m-ellip","Cardio · Zone 2","Elliptical","30 min · Zone 2","Steady sustainable pace",0],["m-rotate","Standing Medicine Ball","Standing Medicine-Ball Torso Rotations","3 × 15","Hold the ball with both hands and rotate left and right comfortably",60],["m-side","Standing Medicine Ball","Standing Medicine-Ball Side Bends","3 × 15","Hold the medicine ball in front of your chest with both hands. Stand upright and bend left and right slowly without twisting.",60],["m-knee","Standing Medicine Ball","Opposite-Knee Medicine-Ball Twists","3 × 15","Rotate the ball left while lifting the opposite bent knee to the right; alternate sides",60]];const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];let day='Sun',remaining=0,timer;const el=id=>document.getElementById(id);function date(){let d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}function key(id){return 'myfitness:'+date()+':'+day+':'+id}function art(id){let shapes={warm:'M15 65H85M25 57H75L65 46H36M52 22L45 40 62 50',bench:'M12 60H88M25 60V73M75 60V73M25 34H75M30 43H70M42 43L36 60M58 43L64 60',lat:'M15 14H85M50 14V33M25 33H75M50 33V65M30 69H70M30 46L50 33 70 46',incline:'M20 70L65 27M20 70H82M36 55L50 67M60 30L80 17M68 25L80 45',row:'M13 69H87M25 45H59M30 45V67M50 26L60 45M60 45L82 35M82 18V67',shoulder:'M25 69V36M25 69H75M50 60V30M24 29H76M32 23V14M68 23V14M32 23L50 30 68 23',rear:'M50 30V66M42 30L18 16M58 30L82 16M42 30L20 46M58 30L80 46M27 69H73',db:'M50 20V52M50 30L30 44M50 30L70 44M30 44L22 30M70 44L78 30M50 52L35 73M50 52L65 73',hammer:'M50 20V52M50 30L30 44M50 30L70 44M22 29V43M78 29V43M50 52L35 73M50 52L65 73',ez:'M50 20V54M50 30L32 44M50 30L68 44M14 44L30 48 40 42 60 48 70 42 86 48M50 54L35 73M50 54L65 73',tri:'M50 10V30M50 30L35 42 50 50 65 42 50 30M50 50V68M25 69H75',tread:'M12 70H86M22 60H82M29 60L46 40 64 48M46 40L51 25M51 25L66 35',stair:'M12 72H32V57H52V42H72V27H88M35 23L52 40 44 57M52 40L68 51'};return '<svg viewBox="0 0 100 82" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schematic exercise illustration"><rect width="100" height="82" rx="10" fill="#343943"/><circle cx="50" cy="15" r="6" fill="#f7b2b9"/><path d="'+(shapes[id]||'')+'" fill="none" stroke="#f7b2b9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>'}function enlarge(id){el('large').innerHTML=photo(id);el('overlay').style.display='flex'}function mark(id,on){localStorage.setItem(key(id),on?'1':'0');render()}function tapExercise(id){mark(id,localStorage.getItem(key(id))!=='1')}function notes(id){let n=el('n-'+id);n.hidden=!n.hidden}const coreDay=()=>['Mon','Wed','Fri'].includes(day);
const shortDay=()=>['Tue','Thu'].includes(day);
function cardioChoice(){return localStorage.getItem(key('cardio-choice'))==='stair'?'stair':'tread'}
function chooseCardio(v){localStorage.setItem(key('cardio-choice'),v);render()}
function activeRoutine(){if(day==='Sat')return [];if(coreDay())return monday.map(r=>r[0]==='m-ellip'&&day!=='Fri'?[r[0],'Cardio · Zones 2 & 3',r[2],'30 min · 25 min Z2 + 5 min Z3','20 min Zone 2, 5 min Zone 3, then 5 min Zone 2. Stay in Zone 2 throughout if tired.',0]:r);if(shortDay())return routine.filter(r=>!['tread','stair'].includes(r[0])).concat([['weekday-cardio','Cardio · Zone 2',cardioChoice()==='stair'?'StairMaster':'Incline Treadmill','30 min · Zone 2','Choose one machine only; keep a sustainable pace.',0]]);return routine}
function reset(){if(confirm('Reset today’s completed exercises?')){activeRoutine().forEach(r=>localStorage.removeItem(key(r[0])));render()}}function clock(){if(el('clock')){let m=Math.floor(Math.max(remaining,0)/60),s=Math.max(remaining,0)%60;el('clock').textContent=m+' min '+String(s).padStart(2,'0')+' sec'}}function start(s){clearInterval(timer);remaining=s;clock();timer=setInterval(()=>{remaining--;clock();if(remaining<=0)clearInterval(timer)},1000)}const exercisePhotoIds={"warm":"Walking_Treadmill","bench":"Barbell_Bench_Press_-_Medium_Grip","lat":"Wide-Grip_Lat_Pulldown","incline":"Leverage_Incline_Chest_Press","row":"Seated_Cable_Rows","shoulder":"Leverage_Shoulder_Press","rear":"Reverse_Machine_Flyes","db":"Dumbbell_Bicep_Curl","hammer":"Hammer_Curls","ez":"EZ-Bar_Curl","tri":"Triceps_Pushdown_-_V-Bar_Attachment","tread":"Walking_Treadmill","stair":"Stairmaster","m-stair":"Stairmaster","m-abs":"Ab_Crunch_Machine","m-back":"Superman","m-ellip":"Elliptical_Trainer","m-rotate":"Standing_Cable_Wood_Chop","m-side":"Dumbbell_Side_Bend","m-knee":"Russian_Twist"};function customDemo(id){
const back=id==='m-back',side=id==='m-side',knee=id==='m-knee';
const pose=(phase)=>{
let a=phase===0?0:phase===1?-1:1;
let angle=back?Math.min(0,a)*13:side?a*19:0;
let shift=!back&&!side?a*15:0;
let legs=back?'<path d="M58 77 L83 80 L83 108 M65 77 L91 81 L91 108" stroke="#384657" stroke-width="13" fill="none" stroke-linecap="round"/><path d="M77 109h17 M86 109h15" stroke="#eee" stroke-width="7" stroke-linecap="round"/>':knee&&a!==0?'<path d="M57 78 L'+(a<0?48:65)+' 109 L'+(a<0?46:67)+' 133 M68 78 L'+(a<0?91:35)+' 83 L'+(a<0?83:43)+' 103" stroke="#384657" stroke-width="13" fill="none" stroke-linecap="round"/><path d="M'+(a<0?40:61)+' 134h13 M'+(a<0?78:38)+' 105h12" stroke="#eee" stroke-width="7" stroke-linecap="round"/>':'<path d="M57 78 L48 106 L45 133 M68 78 L77 106 L80 133" stroke="#384657" stroke-width="13" fill="none" stroke-linecap="round"/><path d="M38 134h15 M74 134h15" stroke="#eee" stroke-width="7" stroke-linecap="round"/>';
return '<g>'+legs+'<g transform="rotate('+angle+' 62 78)"><path d="M49 37 Q62 31 75 37 L72 76 Q62 83 52 76Z" fill="#aeb8c6" stroke="#727f90"/><rect x="58" y="27" width="9" height="12" rx="4" fill="#c99372"/><ellipse cx="'+(62+shift*.22)+'" cy="19" rx="11" ry="13" fill="#d4a080"/><path d="M51 17 Q49 2 64 5 Q75 5 73 16 L68 11 L54 13Z" fill="#3a2926"/><path d="M'+(59+shift*.22)+' 23q3 2 6 0" fill="none" stroke="#815b4b" stroke-width="1"/><path d="M49 40 Q39 51 '+(48+shift)+' 57 M75 40 Q85 51 '+(76+shift)+' 57" stroke="#c99372" stroke-width="9" fill="none" stroke-linecap="round"/>'+(!back?'<circle cx="'+(62+shift)+'" cy="55" r="13" fill="#b94642" stroke="#e17b70" stroke-width="2"/><path d="M'+(51+shift)+' 50q11 9 22 0 M'+(62+shift)+' 42v26" stroke="#792b2b" fill="none"/><circle cx="'+(49+shift)+'" cy="57" r="4" fill="#d4a080"/><circle cx="'+(75+shift)+'" cy="57" r="4" fill="#d4a080"/>':'')+'</g></g>';
};
const machine=back?'<path d="M27 113V65L38 34 M27 113H105 M55 80V113" stroke="#7952a3" stroke-width="7" fill="none" stroke-linecap="round"/><rect x="36" y="71" width="40" height="9" rx="4" fill="#15191f"/><rect x="34" y="32" width="12" height="35" rx="5" fill="#242a33"/>':'';
return '<svg viewBox="0 0 124 150" xmlns="http://www.w3.org/2000/svg" aria-label="Illustrated exercise motion"><rect width="124" height="150" rx="8" fill="#202630"/><path d="M10 139H114" stroke="#4b5563"/>'+machine+'<g>'+pose(0)+'<animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;.25;.5;.75;1" dur="4s" calcMode="discrete" repeatCount="indefinite"/></g><g opacity="0">'+pose(1)+'<animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;.25;.5;.75;1" dur="4s" calcMode="discrete" repeatCount="indefinite"/></g><g opacity="0">'+pose(2)+'<animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;.25;.5;.75;1" dur="4s" calcMode="discrete" repeatCount="indefinite"/></g><g opacity="0">'+pose(0)+'<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.25;.5;.75;1" dur="4s" calcMode="discrete" repeatCount="indefinite"/></g><text x="62" y="147" font-size="6" text-anchor="middle" fill="#ddd">ILLUSTRATED MOTION</text></svg>';
}
function photo(id){if(id==='weekday-cardio')id=cardioChoice();const path=exercisePhotoIds[id];if(['m-back','m-rotate','m-side','m-knee'].includes(id))return customDemo(id);if(!path)return art(id);const base='https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/'+encodeURIComponent(path)+'/';return '<span class="photo-wrap"><img class="photo-frame photo-first" loading="lazy" decoding="async" src="'+base+'0.jpg" alt="Exercise start position" onerror="this.style.opacity=0"><img class="photo-frame photo-second" loading="lazy" decoding="async" src="'+base+'1.jpg" alt="Exercise end position" onerror="this.style.opacity=0"><span class="photo-label">START ↔ FINISH</span></span>'}
function render(){el('tabs').innerHTML=days.map(d=>'<button class="'+(d===day?'active':'')+'" onclick="day=\''+d+'\';render()">'+d+'</button>').join('');el('heading').textContent=day==='Sat'?'Saturday Rest Day':day==='Sun'?'Sunday Workout':day+' Workout';el('sub').textContent=day==='Sat'?'Recovery day':coreDay()?'Core, Lower Back & Cardio':'Upper Body + Zone 2';if(day==='Sat'){el('view').innerHTML='<div class="empty"><h2>'+(day==='Sat'?'Rest & Recover':'Coming Soon')+'</h2><p>'+(day==='Sat'?'Enjoy your rest day.':'We will add your confirmed workout here.')+'</p></div>';return}let current=activeRoutine();let done=current.filter(r=>localStorage.getItem(key(r[0]))==='1').length;let out='<div class="progress"><span>Workout progress</span><b>'+done+' / '+current.length+'</b></div><div class="track"><div class="fill" style="width:'+(done/current.length*100)+'%"></div></div>',group='';if(shortDay())out+='<div class="panel" style="margin:0 0 16px"><b>Choose today’s cardio machine</b><p class="muted">One 30-minute session</p><button style="background:'+(cardioChoice()==='tread'?'#a91e30':'#383d47')+'" onclick="chooseCardio(\'tread\')">Treadmill</button><button style="background:'+(cardioChoice()==='stair'?'#a91e30':'#383d47')+'" onclick="chooseCardio(\'stair\')">StairMaster</button></div>';for(let r of current){let [id,g,name,dose,tip,rest]=r;if(g!==group){group=g;out+='<div class="group">'+g.toUpperCase()+'</div>'}let checked=localStorage.getItem(key(id))==='1';out+='<div class="item '+(checked?'done':'')+'" role="button" tabindex="0" aria-label="Toggle completion for '+name+'" onclick="if(event.target.closest(\'button,input\'))return;tapExercise(\''+id+'\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();tapExercise(\''+id+'\')}"><button class="art" aria-label="Enlarge '+name+' exercise reference" onclick="enlarge(\''+id+'\')">'+photo(id)+'</button><div class="content"><div class="name">'+name+'</div><div class="dose">'+dose+'</div>'+(rest?'<div class="rest">Rest '+(rest===150?'2–3 min':rest===105?'1 min 30 sec – 2 min':rest===60?'1 min':'1 min – 1 min 30 sec')+'</div>':'')+'<div class="tips" id="n-'+id+'">'+tip+'</div></div><input class="check" aria-label="Complete '+name+'" type="checkbox" '+(checked?'checked':'')+' onchange="mark(\''+id+'\',this.checked)"></div>'}out+='<div class="panel"><b>⏱ Rest Timer</b><p class="muted">Tap a rest interval to start.</p><h2 id="clock">0 min 00 sec</h2><button onclick="start(60)">1 min</button><button onclick="start(90)">1 min 30 sec</button><button onclick="start(120)">2 min</button><p class="muted">'+(coreDay()?'Core machines: 1–1.5 min · Medicine ball: 1 min.':'Bench: 2–3 min · Chest/back/shoulder presses & row: 1 min 30 sec – 2 min · Rear delts/arms: 1 min – 1 min 30 sec.')+'</p></div><button class="reset" onclick="reset()">Reset today’s checks</button><p class="muted">Tap an exercise to complete it. Tap again to undo. Your checks save automatically for each day. Real exercise reference photos cycle between the start and finish positions. They are not continuous-motion videos, and equipment may differ from your exact gym machines. Photos: free-exercise-db (public domain).</p>';el('view').innerHTML=out;clock()}render();</script></body></html>
